name: Agentic Account Morning Monitor

on:
  schedule:
    # Every 5 minutes during market hours — script exits cleanly when market is closed
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor prices and sell on trigger
        id: monitor
        env:
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_MFA_CODE: ${{ secrets.RH_MFA_CODE }}
        run: |
          python monitor_spcx.py | tee /tmp/monitor_output.txt
          echo "all_sold=$(grep -c 'ALL POSITIONS SOLD' /tmp/monitor_output.txt || true)" >> $GITHUB_OUTPUT

      - name: Disable workflow after all positions sold
        if: steps.monitor.outputs.all_sold != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable spcx_monitor.yml
          echo "All positions sold — workflow disabled."
