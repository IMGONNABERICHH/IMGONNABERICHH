# The site is a single static file — nothing to build, just publish the root.
[build]
  publish = "."

# Long-cache the images, never the HTML: the page is one file, so a stale copy
# means a stale booking form.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The studio invoicing page is not for clients — keep it out of search results.
# The real protection is the studio key the function checks; this is just hygiene.
[[headers]]
  for = "/studio.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# publish = "." would otherwise serve the function source as a static file.
[[redirects]]
  from = "/netlify/*"
  status = 404
  to = "/index.html"
