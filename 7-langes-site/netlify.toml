# The site is a single static file — nothing to build, just publish the root.
[build]
  publish = "."

# Long-cache the images, never the HTML: the page is one file, so a stale copy
# means a stale booking form.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
