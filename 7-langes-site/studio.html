<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>7 L'ANGES — Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --black:#080808; --white:#ece8e1; --gray:#555; }
    html, body {
      background: var(--black); color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px; line-height: 1.6; letter-spacing: 0.02em;
      min-height: 100vh; -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 34px 22px 90px; }
    h1 {
      font-family: Georgia, serif; font-weight: 300; font-size: 26px;
      letter-spacing: 0.04em;
    }
    .sub {
      font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--gray); margin-bottom: 26px;
    }

    /* ─── Tabs ─── */
    .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; }
    .tab {
      flex: 1; background: none; border: none; color: var(--gray);
      font: inherit; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
      padding: 15px 4px; cursor: pointer; border-bottom: 1px solid transparent;
      margin-bottom: -1px;
    }
    .tab.on { color: var(--white); border-bottom-color: var(--white); }
    .tab .count {
      font-size: 9px; color: var(--black); background: var(--white);
      border-radius: 9px; padding: 1px 6px; margin-left: 7px; letter-spacing: 0.06em;
    }
    .panel { display: none; }
    .panel.on { display: block; }

    /* ─── Fields ─── */
    label {
      display: block; font-size: 9px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--gray); margin: 20px 0 8px;
    }
    input, select {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      padding: 11px 0; color: var(--white); font: inherit; font-size: 16px;
      outline: none; border-radius: 0; -webkit-appearance: none;
    }
    /* 16px keeps iOS from zooming the page when a field takes focus */
    select option { background: #111; }
    input:focus, select:focus { border-bottom-color: rgba(236,232,225,0.5); }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }

    button.go {
      width: 100%; margin-top: 34px; background: var(--white); color: #080808;
      border: none; padding: 18px; font: inherit; font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer; border-radius: 0;
    }
    button.go:disabled { opacity: 0.45; }

    .split {
      margin-top: 24px; padding: 16px 18px; border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px; color: #8a8a8a; line-height: 2;
    }
    .split b { color: var(--white); font-weight: 400; }

    /* ─── Booking cards ─── */
    .booking {
      border: 1px solid rgba(255,255,255,0.12); padding: 18px; margin-top: 14px;
    }
    .booking.fresh { border-color: rgba(236,232,225,0.4); }
    .b-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .b-name { font-family: Georgia, serif; font-size: 20px; font-weight: 300; }
    .b-new {
      font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
      background: var(--white); color: var(--black); padding: 2px 7px;
    }
    .b-ago { margin-left: auto; font-size: 10px; color: var(--gray); letter-spacing: 0.1em; }
    .b-when { font-size: 13px; color: var(--white); margin-bottom: 10px; }
    .b-meta { font-size: 12px; color: #7d7d7d; line-height: 1.9; }
    .b-meta a { color: #9d9d9d; }
    .b-project {
      font-size: 12px; color: #8a8a8a; line-height: 1.9; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.07);
    }
    .b-act {
      margin-top: 14px; width: 100%; background: transparent; color: var(--white);
      border: 1px solid rgba(255,255,255,0.25); padding: 12px; font: inherit;
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    }
    .b-act:hover { border-color: var(--white); }
    .b-free { margin-top: 12px; font-size: 11px; color: var(--gray); letter-spacing: 0.08em; }

    .empty { margin-top: 30px; font-size: 13px; color: #6b6b6b; line-height: 2; }

    /* ─── Output ─── */
    .out { margin-top: 26px; display: none; }
    .out.on { display: block; }
    .card { border: 1px solid rgba(255,255,255,0.14); padding: 18px; margin-bottom: 12px; }
    .card .lbl {
      font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--gray); margin-bottom: 8px;
    }
    .card .amt { font-family: Georgia, serif; font-size: 24px; margin-bottom: 4px; }
    .card .due { font-size: 11px; color: #8a8a8a; margin-bottom: 12px; }
    .card a { color: var(--white); font-size: 11px; letter-spacing: 0.14em; word-break: break-all; }

    .msg { margin-top: 22px; font-size: 12px; line-height: 1.9; display: none; }
    .msg.on { display: block; }
    .msg.bad { color: #c98b7a; }
    .msg.good { color: #8fae8f; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Studio</h1>
    <p class="sub">7 L'ANGES · internal</p>

    <label for="key">Studio Key</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="Saved on this device after the first time">

    <div class="tabs" style="margin-top:28px">
      <button class="tab on" data-panel="bookings" id="tab-bookings">Bookings</button>
      <button class="tab" data-panel="invoice" id="tab-invoice">Invoices</button>
    </div>

    <!-- ─── BOOKINGS ─── -->
    <div class="panel on" id="panel-bookings">
      <button class="go" id="load" style="margin-top:24px">Load Bookings</button>
      <p class="msg" id="b-msg"></p>
      <div id="list"></div>
    </div>

    <!-- ─── INVOICES ─── -->
    <div class="panel" id="panel-invoice">
      <label for="cname">Client Name</label>
      <input id="cname" type="text" autocomplete="off">

      <label for="cemail">Client Email</label>
      <input id="cemail" type="email" autocomplete="off" placeholder="Where the invoice goes">

      <label for="stype">Session</label>
      <select id="stype">
        <option value="Half Day Shoot" data-base="5000">Half Day Shoot — from $5,000</option>
        <option value="Full Day Shoot" data-base="8500">Full Day Shoot — from $8,500</option>
        <option value="Multi-Day / Campaign" data-base="20000">Multi-Day / Campaign — from $20,000</option>
      </select>

      <div class="row">
        <div>
          <label for="sdate">Shoot Date</label>
          <input id="sdate" type="date">
        </div>
        <div>
          <label for="stime">Call Time</label>
          <select id="stime">
            <option>6:00 AM</option><option>7:00 AM</option><option selected>8:00 AM</option>
            <option>9:00 AM</option><option>10:00 AM</option><option>11:00 AM</option>
            <option>12:00 PM</option><option>2:00 PM</option>
          </select>
        </div>
      </div>

      <label for="total">Agreed Total (USD)</label>
      <input id="total" type="number" min="1" step="1" inputmode="decimal">

      <div class="split" id="split"></div>

      <button class="go" id="send">Create &amp; Send &nbsp;→</button>

      <p class="msg" id="i-msg"></p>
      <div class="out" id="out"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const dollars = n => '$' + n.toLocaleString('en-US');
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // The key is typed once per device, not once per booking.
    $('key').value = localStorage.getItem('studioKey') || '';
    const keyOf = () => $('key').value.trim();

    /* ─── Tabs ─── */
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
      document.querySelectorAll('.panel').forEach(p =>
        p.classList.toggle('on', p.id === 'panel-' + t.dataset.panel));
    }));

    const show = (node, text, good) => {
      node.textContent = text;
      node.className = 'msg on ' + (good ? 'good' : 'bad');
    };

    /* ─── Bookings ─── */
    const BASE = { 'Half Day Shoot': 5000, 'Full Day Shoot': 8500, 'Multi-Day / Campaign': 20000 };
    let bookings = [];

    function ago(iso) {
      const mins = Math.round((Date.now() - new Date(iso)) / 60000);
      if (mins < 60) return mins + 'm ago';
      if (mins < 1440) return Math.round(mins / 60) + 'h ago';
      return Math.round(mins / 1440) + 'd ago';
    }

    // Anything not seen on this device before gets flagged, so a new request
    // stands out without needing anywhere to store "read" state server-side.
    const seen = new Set(JSON.parse(localStorage.getItem('seenBookings') || '[]'));

    function renderBookings() {
      if (!bookings.length) {
        $('list').innerHTML = '<p class="empty">No bookings yet. They appear here the moment a client submits one.</p>';
        return;
      }
      $('list').innerHTML = bookings.map((b, i) => {
        const isNew = !seen.has(b.id);
        const free = /Discovery Call/i.test(b.sessionType);
        return `
        <div class="booking${isNew ? ' fresh' : ''}">
          <div class="b-top">
            <span class="b-name">${esc(b.name || 'Unnamed')}</span>
            ${isNew ? '<span class="b-new">New</span>' : ''}
            <span class="b-ago">${ago(b.receivedAt)}</span>
          </div>
          <p class="b-when">${esc(b.when || [b.sessionType, b.date, b.time].filter(Boolean).join(' · '))}</p>
          <p class="b-meta">
            <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>
            ${b.phone ? ' · <a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a>' : ''}
            ${b.organization ? '<br>' + esc(b.organization) : ''}
            ${b.budget ? '<br>Budget: ' + esc(b.budget) : ''}
            ${b.location ? '<br>' + esc(b.location) : ''}
          </p>
          ${b.project ? `<p class="b-project">${esc(b.project)}</p>` : ''}
          ${free
            ? '<p class="b-free">Discovery call — nothing to invoice.</p>'
            : `<button class="b-act" onclick="toInvoice(${i})">Invoice this &nbsp;→</button>`}
        </div>`;
      }).join('');

      bookings.forEach(b => seen.add(b.id));
      localStorage.setItem('seenBookings', JSON.stringify([...seen].slice(-300)));
    }

    async function loadBookings() {
      const btn = $('load'), msg = $('b-msg');
      if (!keyOf()) return show(msg, 'Enter the studio key first.', false);

      btn.disabled = true; btn.textContent = 'Loading…';
      msg.className = 'msg';
      try {
        const res = await fetch('/.netlify/functions/list-bookings', {
          headers: { 'x-studio-key': keyOf() },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load bookings.');

        localStorage.setItem('studioKey', keyOf());
        bookings = data.bookings || [];
        const fresh = bookings.filter(b => !seen.has(b.id)).length;
        $('tab-bookings').innerHTML = 'Bookings' + (fresh ? `<span class="count">${fresh}</span>` : '');
        renderBookings();
        if (data.note) show(msg, data.note, true); else msg.className = 'msg';
      } catch (err) {
        show(msg, err.message, false);
      } finally {
        btn.disabled = false; btn.textContent = 'Refresh Bookings';
      }
    }

    $('load').addEventListener('click', loadBookings);

    /* Carry a booking straight into the invoice screen — no retyping. */
    function toInvoice(i) {
      const b = bookings[i];
      $('cname').value = b.name || '';
      $('cemail').value = b.email || '';

      if (BASE[b.sessionType]) $('stype').value = b.sessionType;
      $('total').value = BASE[b.sessionType] || '';

      if (b.date) $('sdate').value = b.date;
      if (b.time && [...$('stime').options].some(o => o.value === b.time)) $('stime').value = b.time;

      syncSplit();
      document.querySelector('.tab[data-panel="invoice"]').click();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      show($('i-msg'), 'Loaded from ' + (b.name || 'booking') + '. Check the total, then send.', true);
    }

    /* ─── Invoices ─── */
    function syncSplit() {
      const total = Number($('total').value) || 0;
      const dep = Math.round(total / 2);
      $('split').innerHTML = total
        ? `<b>${dollars(dep)}</b> now to lock the date<br>
           <b>${dollars(total - dep)}</b> due 72 hours before the shoot`
        : 'Enter a total to see the split.';
    }

    $('stype').addEventListener('change', () => {
      $('total').value = $('stype').selectedOptions[0].dataset.base;
      syncSplit();
    });
    $('total').addEventListener('input', syncSplit);
    $('total').value = $('stype').selectedOptions[0].dataset.base;
    syncSplit();

    $('send').addEventListener('click', async () => {
      const msg = $('i-msg'), out = $('out'), btn = $('send');
      msg.className = 'msg'; out.className = 'out'; out.innerHTML = '';

      const body = {
        clientName: $('cname').value.trim(),
        clientEmail: $('cemail').value.trim(),
        sessionType: $('stype').value,
        shootDate: $('sdate').value,
        shootTime: $('stime').value,
        totalDollars: $('total').value,
      };

      if (!keyOf() || !body.clientEmail || !body.shootDate || !body.totalDollars)
        return show(msg, 'Studio key, client email, shoot date and total are all needed.', false);

      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/.netlify/functions/create-invoices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-studio-key': keyOf() },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        localStorage.setItem('studioKey', keyOf());
        show(msg, data.note || 'Sent. The client has the invoice in their inbox.', true);

        out.innerHTML = data.invoices.map(i => `
          <div class="card">
            <p class="lbl">${esc(i.label)}</p>
            <p class="amt">${esc(i.amount)}</p>
            ${i.due ? `<p class="due">Due ${esc(i.due)}</p>` : ''}
            <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a>
          </div>`).join('');
        out.className = 'out on';
      } catch (err) {
        show(msg, err.message, false);
      } finally {
        btn.disabled = false; btn.innerHTML = 'Create &amp; Send &nbsp;→';
      }
    });

    // If the key is already remembered, go straight to the list.
    if (keyOf()) loadBookings();
  </script>
</body>
</html>
